name = "prism-relay"
account_id = "c431da740e42c0b57f901b8ba2115bbc"
main = "src/cloudflare-adapter.ts"
compatibility_date = "2024-12-01"

# Mount the relay under /relay/* on prism.digitalgriot.studio.
# The cloudflare-adapter.ts has been patched to strip the /relay prefix
# before routing to /health and /ws handlers.
routes = [
  { pattern = "prism.digitalgriot.studio/relay/*", zone_name = "digitalgriot.studio" }
]

[observability]
enabled = true

[[durable_objects.bindings]]
name = "RELAY"
class_name = "RelayDurableObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelayDurableObject"]